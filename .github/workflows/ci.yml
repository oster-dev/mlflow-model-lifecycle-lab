name: Lint and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install metaflow

      - name: Lint
        run: |
          ruff format --check .
          ruff check .

      - name: Test
        run: |
          pytest -v

      - name: Validate Metaflow graph
        run: |
          python flows/engagement_training_flow.py show